name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 说明
# ---------------------------------------------------------------------------
# 这里只跑「不依赖模型权重与数据库」的检查，因此可以在干净 runner 上完成：
#   · 前端：类型检查（tsc --noEmit）→ ESLint（--max-warnings 0）→ 生产构建 → vitest
#   · 后端：全量语法编译（compileall）+ ruff 静态检查 + pytest（tests/ 纯函数）
#
# 分工（刻意如此，别混）：
#   · `tests/`（pytest + vitest）= 纯函数与不变量，毫秒级、零外部状态、进 CI
#   · `scripts/verify_*` 38 套   = 端到端与契约，需要 `outputs/models/lstm_v1.pt`
#                                  与初始化后的 SQLite（均不入库）⇒ 交付前本地回归，不进 CI
#   硬把后者塞进 CI 只会得到「永久红」或「永久 skip」，两者都比不跑更糟。

jobs:
  frontend:
    name: 前端（typecheck · lint · build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: ESLint（零警告）
        run: npm run lint

      - name: 生产构建
        run: npm run build

      - name: 产物自检（index.html 必须引用带 hash 的 assets）
        run: |
          test -f dist/index.html
          grep -qE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html
          echo "构建产物 OK"
          ls -la dist/assets | head -10

  backend:
    name: 后端（语法编译）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 全量语法编译（不装依赖）
        run: python -m compileall -q app scripts code/backend

      - name: schema.sql 基本完整性（8 张表 / 含管理员种子）
        run: |
          grep -c 'CREATE TABLE' code/db/schema.sql
          grep -q 'users' code/db/schema.sql
          echo "schema.sql OK"

  unit:
    name: 单元测试（ruff · pytest · vitest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # 🔒 不装 torch：`tests/` 只覆盖纯函数与不变量，导入链不触碰算法层
      #    （实测 `import app.services.result_service` 不会加载 torch）。
      #    装 torch 会让这一步从 30 s 变成 5 min，收益为零。
      - name: 安装测试依赖
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: ruff（静态检查）
        run: ruff check app tests

      - name: pytest（纯函数 / 不变量）
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 前端单测（vitest）
        working-directory: web
        run: |
          npm ci
          npm run test

  hygiene:
    name: 仓库卫生（密钥与产物不入库）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 禁止入库的文件不得存在
        run: |
          fail=0
          for p in .env deploy/web/dist web/node_modules; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              echo "::error::不允许入库：$p"
              fail=1
            fi
          done
          if git ls-files | grep -qE '^deploy/'; then
            echo "::error::deploy/ 含生产密钥，不得入库"
            fail=1
          fi
          exit $fail

      - name: 源码中不得出现明文默认口令
        run: |
          if git grep -n -- 'Admin@2026' -- 'web/src' 'app' 'scripts/*.mjs'; then
            echo "::error::源码中出现种子默认口令，请改为环境变量或占位符"
            exit 1
          fi
          echo "口令检查 OK"
